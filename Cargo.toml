[package]
name = "apexcontrol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A simple native control panel for SteelSeries Apex keyboards"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "=0.1.34"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
tray-icon = { version = "=0.26.1", default-features = false }
winreg = "=0.56.0"
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading", "Win32_UI_Input"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-static-hidraw"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

